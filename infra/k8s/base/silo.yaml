# Orleans silos discover each other through Redis membership, so they scale as a plain Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
spec:
  replicas: 2
  selector:
    matchLabels: { app: silo }
  template:
    metadata:
      labels: { app: silo }
    spec:
      containers:
        - name: silo
          image: realmforge/server-silo
          envFrom:
            - secretRef: { name: realmforge-config }
          ports:
            - { name: silo, containerPort: 11111 }
            - { name: gateway, containerPort: 30000 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 2Gi }
