apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: realmforge/server-gateway
          envFrom:
            - secretRef: { name: realmforge-config }
          env:
            - { name: ASPNETCORE_URLS, value: "http://0.0.0.0:5080" }
          ports:
            - { name: http, containerPort: 5080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
