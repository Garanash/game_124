- id: aldmark
  name: Альдмарк
  description: Срединное королевство людей — пшеничные равнины, каменные мосты и торговые тракты между лесом эльфов и горами дворфов.
- id: eldarwen
  name: Эльдарвен
  description: Древние леса, серебряные города эльфов и фейские поляны, где время течёт иначе.
- id: kargath
  name: Каргат
  description: Горный хребет с подгорными кузнями, гоблинскими норами и уютными предгорными долинами.
- id: sarrat
  name: Саррат
  description: Золотые саванны, раскалённые дюны и душные змеиные джунгли.
- id: talmarin
  name: Тал'Марин
  description: Архипелаг коралловых рифов, штормовых шпилей и затонувших храмов.
- id: veylmark
  name: Вейлмарк
  description: Опалённое пограничье, где из астральных разломов в мир просачиваются чужие планы.
