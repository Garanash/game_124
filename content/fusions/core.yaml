# Inputs must touch each other in the backpack; they are consumed and replaced by the output.
- { id: fuse_twin_daggers, inputs: [dagger, dagger], output: twin_daggers }
- { id: fuse_long_sword, inputs: [short_sword, short_sword], output: long_sword }
- { id: fuse_great_sword, inputs: [long_sword, long_sword], output: great_sword }
- { id: fuse_flame_blade, inputs: [long_sword, ruby, whetstone], output: flame_blade }
- { id: fuse_holy_mace, inputs: [mace, holy_symbol], output: holy_mace }
- { id: fuse_long_bow, inputs: [short_bow, short_bow], output: long_bow }
- { id: fuse_arcane_staff, inputs: [oak_staff, spellbook, sapphire], output: arcane_staff }
- { id: fuse_iron_shield, inputs: [wooden_shield, wooden_shield], output: iron_shield }
- { id: fuse_tower_shield, inputs: [iron_shield, iron_shield], output: tower_shield }
- { id: fuse_fortune_charm, inputs: [lucky_coin, four_leaf_clover], output: fortune_charm }
- { id: fuse_greater_potion, inputs: [healing_potion, healing_potion, healing_potion], output: greater_healing_potion }
