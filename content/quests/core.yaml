# Class trials: offered by every start-zone mentor; completing one unlocks the class.
- id: trial_fighter
  name: "Испытание стали"
  min_level: 2
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Наставник предлагает добить поверженного противника на тренировочной арене."
      choices:
        - { id: honor, text: "Протянуть руку поверженному", alignment: { law: 10, good: 10 } }
        - { id: ruthless, text: "Добить ради победы", alignment: { law: -5, good: -15 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: fighter
- id: trial_wizard
  name: "Испытание разума"
  min_level: 2
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Вы нашли запретную страницу гримуара."
      choices:
        - { id: report, text: "Отдать страницу в библиотеку", alignment: { law: 15, good: 5 } }
        - { id: keep, text: "Тайно оставить себе", alignment: { law: -15, good: -5 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: wizard
- id: trial_cleric
  name: "Испытание веры"
  min_level: 2
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Раненый разбойник просит исцеления."
      choices:
        - { id: heal, text: "Исцелить без условий", alignment: { law: 0, good: 20 } }
        - { id: judge, text: "Исцелить и сдать страже", alignment: { law: 15, good: 5 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: cleric
- id: trial_rogue
  name: "Испытание тени"
  min_level: 2
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Наставник просит стянуть кошель у самодовольного купца."
      choices:
        - { id: steal, text: "Обчистить купца", alignment: { law: -15, good: -5 } }
        - { id: trick, text: "Разыграть купца и вернуть кошель", alignment: { law: -5, good: 10 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: rogue
- id: trial_ranger
  name: "Испытание следа"
  min_level: 2
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Вы выследили браконьеров, ставящих капканы на молодняк."
      choices:
        - { id: free, text: "Освободить зверей и прогнать браконьеров", alignment: { law: -5, good: 15 } }
        - { id: deliver, text: "Привести браконьеров к судье", alignment: { law: 15, good: 5 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: ranger
- id: trial_paladin
  name: "Испытание клятвы"
  min_level: 2
  alignment:
    moral: [Good]
  steps:
    - id: spar
      type: Kill
      text: Одолейте тренировочные манекены на арене наставника.
      target_id: training_dummy
      count: 3
      next: decision
    - id: decision
      type: Choice
      text: "Вам предстоит принести клятву защищать слабых."
      choices:
        - { id: oath_devotion, text: "Клятва преданности", alignment: { law: 15, good: 15 } }
        - { id: oath_vengeance, text: "Клятва мести", alignment: { law: 0, good: 5 } }
  rewards:
    xp: 600
    gold: 15
    unlocks_class_id: paladin

# Start-zone stories
- id: quest_silverleaf_welcome
  name: "Тревога над Серебряный Лист"
  steps:
    - id: hunt
      type: Kill
      text: "Окрестности Серебряный Лист кишат опасностью. Расправьтесь с угрозой."
      target_id: wolf
      count: 4
      next: report
    - id: report
      type: Talk
      text: Вернитесь к старосте.
      target_id: npc_silverleaf_elder
      next: verdict
    - id: verdict
      type: Choice
      text: Среди нападавших был выживший. Что с ним делать?
      choices:
        - { id: spare, text: "Отпустить его", alignment: { law: -5, good: 10 }, reputation: [{ faction_id: faction_eldarwen, amount: 50 }] }
        - { id: jail, text: "Отдать под суд", alignment: { law: 10, good: 0 }, reputation: [{ faction_id: faction_eldarwen, amount: 150 }] }
        - { id: execute, text: "Казнить на месте", alignment: { law: 0, good: -15 }, reputation: [{ faction_id: faction_eldarwen, amount: -50 }] }
  rewards:
    xp: 300
    gold: 20
    items: [{ item_id: healing_potion, quantity: 2 }, { item_id: whetstone, quantity: 1 }]
    reputation: [{ faction_id: faction_eldarwen, amount: 200 }]
